name: Cleanup branch Docker images

on:
  delete:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Delete branch container image
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = "${{ github.event.ref }}";
            // Sanitize branch name the same way docker/metadata-action does
            const tag = branch.replace(/[^a-zA-Z0-9._-]+/g, '-');
            const owner = context.repo.owner.toLowerCase();
            const packageName = context.repo.repo.toLowerCase();

            core.info(`Looking for package ${packageName} version with tag ${tag}`);

            async function findAndDelete(listFn, deleteFn) {
              const versions = await listFn();
              for (const version of versions.data) {
                const tags = version.metadata?.container?.tags || [];
                if (tags.includes(tag)) {
                  core.info(`Deleting version ${version.id} with tags: ${tags.join(', ')}`);
                  await deleteFn(version.id);
                  core.info(`Deleted version ${version.id}`);
                  return true;
                }
              }
              return false;
            }

            // Try user-owned package first, then org-owned
            try {
              const found = await findAndDelete(
                () => github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                  package_type: 'container', package_name: packageName, username: owner,
                }),
                (id) => github.rest.packages.deletePackageVersionForUser({
                  package_type: 'container', package_name: packageName, username: owner, package_version_id: id,
                })
              );
              if (found) return;
            } catch (_) { /* not a user package */ }

            try {
              const found = await findAndDelete(
                () => github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                  package_type: 'container', package_name: packageName, org: owner,
                }),
                (id) => github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container', package_name: packageName, org: owner, package_version_id: id,
                })
              );
              if (found) return;
            } catch (error) {
              core.warning(`Failed to cleanup package: ${error.message}`);
            }

            core.info(`No version found with tag ${tag}`);
